name: Check plugins

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Check every plugin
        run: python tools/build_catalog.py
      - name: Check every script parses
        run: |
          for f in $(git ls-files 'plugins/**/*.js'); do node --check "$f"; done
      - name: Test Cooldowns timers
        run: node --test tests/cooldowns-*.test.mjs
