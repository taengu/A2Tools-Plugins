<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Death Recap</title>
  <link rel="stylesheet" href="widget.css" />
</head>
<body>
  <div class="card" hidden>
    <button type="button" class="dismiss" aria-label="Hide"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg></button>
    <!-- One tag per class: on Linux the meter inlines only pictures written in the page. -->
    <img class="classIcon" data-class="gladiator" src="icons/gladiator.png" alt="" hidden />
    <img class="classIcon" data-class="templar" src="icons/templar.png" alt="" hidden />
    <img class="classIcon" data-class="assassin" src="icons/assassin.png" alt="" hidden />
    <img class="classIcon" data-class="ranger" src="icons/ranger.png" alt="" hidden />
    <img class="classIcon" data-class="sorcerer" src="icons/sorcerer.png" alt="" hidden />
    <img class="classIcon" data-class="elementalist" src="icons/elementalist.png" alt="" hidden />
    <img class="classIcon" data-class="cleric" src="icons/cleric.png" alt="" hidden />
    <img class="classIcon" data-class="chanter" src="icons/chanter.png" alt="" hidden />
    <img class="classIcon" data-class="fighter" src="icons/fighter.png" alt="" hidden />
    <div class="body">
      <div class="title"><span class="killedBy"></span> <span class="name"></span> <span class="assistCount"></span></div>
      <div class="sub"></div>
      <div class="stats">
        <span class="cpBox"><img src="icons/cp.png" alt="" /><b class="cp"></b></span>
        <span class="gsBox"><img src="icons/gs.png" alt="" /><b class="gs"></b></span>
        <span class="damage"></span>
        <span class="dps"></span>
        <span class="fight"></span>
      </div>
      <div class="extra"></div>
    </div>
  </div>
  <script src="/_sdk/a2.js"></script>
  <script src="widget.js"></script>
</body>
</html>
