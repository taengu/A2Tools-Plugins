<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Death Recap</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="last" data-t="tabLast">Last death</button>
    <button type="button" role="tab" data-tab="history" data-t="tabHistory">History</button>
    <button type="button" role="tab" data-tab="tally" data-t="tabTally">Tally</button>
    <button type="button" role="tab" data-tab="settings" data-t="tabSettings">Settings</button>
    <span class="shotStatus" role="status"></span>
    <button type="button" class="shot" data-t-label="screenshot" aria-label="Screenshot" title="Screenshot" hidden><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg></button>
  </nav>
  <main class="view" data-view="last"></main>
  <main class="view" data-view="history" hidden></main>
  <main class="view" data-view="tally" hidden>
    <div class="tallyBy" role="radiogroup">
      <button type="button" data-by="player" data-t="byPlayer">By player</button>
      <button type="button" data-by="legion" data-t="byLegion">By legion</button>
      <button type="button" data-by="server" data-t="byServer">By server</button>
    </div>
    <ol class="tallyList"></ol>
  </main>
  <main class="view settings" data-view="settings" hidden>
    <label class="row">
      <span data-t="popupStyle">Popup when a player kills you</span>
      <select class="style">
        <option value="toast" data-t="styleToast">Corner toast</option>
        <option value="banner" data-t="styleBanner">Centre banner</option>
        <option value="strip" data-t="styleStrip">Slim strip</option>
        <option value="off" data-t="styleOff">No popup</option>
      </select>
    </label>
    <label class="row">
      <span data-t="hideAfter">Hide the popup after</span>
      <select class="hideAfter">
        <option value="5"></option>
        <option value="10"></option>
        <option value="20"></option>
        <option value="0" data-t="untilClicked">Until clicked</option>
      </select>
    </label>
    <label class="row">
      <span data-t="popupSize">Popup size</span>
      <select class="size">
        <option value="1" data-t="small">Small</option>
        <option value="1.25" data-t="medium">Medium</option>
        <option value="1.5" data-t="large">Large</option>
      </select>
    </label>
    <p class="note" data-t="popupHelp">Drag the popup to move it. Click it to open this window.</p>
    <div class="buttons">
      <button type="button" class="test" data-t="test">Show a test popup</button>
      <button type="button" class="clear danger" data-t="clear">Clear history</button>
    </div>
    <p class="note" data-t="note">Only after a death: nothing is shown about players while you live.</p>
  </main>
  <script src="/_sdk/a2.js"></script>
  <script src="icons.js"></script>
  <script src="i18n.js"></script>
  <script src="servers.js"></script>
  <script src="logic.js"></script>
  <script src="plugin.js"></script>
</body>
</html>
