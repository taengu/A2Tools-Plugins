<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ping</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="now">
      <span class="label" data-t="now">Ping now</span>
      <span class="readings">
        <span class="value" data-state="none">–</span>
        <span class="jitter"></span>
      </span>
    </header>
    <section class="history">
      <div class="historyHead">
        <span data-t="history">History</span>
        <select class="range">
          <option value="15" data-t="r15">15 minutes</option>
          <option value="60" data-t="r60">1 hour</option>
          <option value="360" data-t="r360">6 hours</option>
          <option value="1440" data-t="r1440">24 hours</option>
        </select>
      </div>
      <svg class="chart" role="img" aria-label="Ping history"></svg>
      <div class="axis"><span class="from"></span><span class="hover"></span><span class="to"></span></div>
      <p class="note noHistory" data-t="noHistory" hidden>No readings in this time yet.</p>
      <dl class="stats"></dl>
      <div class="daily" hidden>
        <div class="dailyHead" data-t="daily">Each day</div>
        <div class="dailyScroll">
          <table>
            <thead><tr></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
    <section class="rows">
      <label class="row">
        <span data-t="show">Show the ping widget</span>
        <input type="checkbox" class="show" />
      </label>
      <label class="row">
        <span data-t="lock">Lock the widget</span>
        <input type="checkbox" class="lock" />
      </label>
      <p class="note" data-t="lockNote">Clicks pass through to the game. Unlock to move it.</p>
      <label class="row">
        <span data-t="cycle">Alternate ping and jitter</span>
        <input type="checkbox" class="cycle" />
      </label>
      <p class="note" data-t="cycleNote">The widget shows the jitter 5 s after each ping, then the next ping.</p>
      <p class="note jitterOld" data-t="jitterOld" hidden>Jitter needs meter 2.0.99 or newer.</p>
      <label class="row">
        <span data-t="fps">Show the game's FPS</span>
        <input type="checkbox" class="fps" />
      </label>
      <p class="note fpsNote" hidden><span class="text"></span> <button type="button" class="admin" data-t="fpsAdminButton" hidden>Run as administrator</button></p>
      <label class="row">
        <span data-t="background">Show the background</span>
        <input type="checkbox" class="background" />
      </label>
      <label class="row">
        <span data-t="bars">Show the signal bars</span>
        <input type="checkbox" class="bars" />
      </label>
      <label class="row">
        <span data-t="size">Size</span>
        <select class="size">
          <option value="1" data-t="small">Small</option>
          <option value="1.3" data-t="medium">Medium</option>
          <option value="1.7" data-t="large">Large</option>
        </select>
      </label>
      <label class="row">
        <span data-t="good">Green up to</span>
        <span class="num"><input type="number" class="good" min="10" max="500" step="10" /> ms</span>
      </label>
      <label class="row">
        <span data-t="fair">Amber up to</span>
        <span class="num"><input type="number" class="fair" min="20" max="1000" step="10" /> ms</span>
      </label>
      <label class="row fpsRow" hidden>
        <span data-t="fpsGood">FPS green from</span>
        <span class="num"><input type="number" class="fpsGood" min="2" max="500" step="5" /> fps</span>
      </label>
      <label class="row fpsRow" hidden>
        <span data-t="fpsFair">FPS amber from</span>
        <span class="num"><input type="number" class="fpsFair" min="1" max="500" step="5" /> fps</span>
      </label>
      <p class="note" data-t="help">Drag the widget anywhere. Double-click it to open this window.</p>
    </section>
    <script src="/_sdk/a2.js"></script>
    <script src="plugin.js"></script>
  </body>
</html>
